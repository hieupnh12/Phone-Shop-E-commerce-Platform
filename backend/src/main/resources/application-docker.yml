# Profile Docker — override cấu hình local khi chạy trên VPS
spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: ${GOOGLE_OAUTH2_REDIRECT_URI:http://localhost:8080/phoneShop/login/oauth2/code/google}

  jpa:
    show-sql: false

jwt:
  signerKey: ${JWT_SIGNER_KEY:change-me-in-production}

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME:}
  api:
    key: ${CLOUDINARY_API_KEY:}
    secret: ${CLOUDINARY_API_SECRET:}

speedsms:
  access_token: ${SPEEDSMS_ACCESS_TOKEN:}

app:
  public-url: ${APP_PUBLIC_URL:https://maclenin.io.vn}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mobile-notification:
    enabled: ${MOBILE_NOTIFICATION_ENABLED:true}
    trigger-url: ${MOBILE_NOTIFICATION_TRIGGER_URL:https://maclenin.io.vn/mobile/notifications/triggers/order-status}

logging:
  level:
    com.websales: INFO
    org.springframework.security: WARN
